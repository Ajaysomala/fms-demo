# DRAFT from Figma designs only. Never run. Staging only.
# Precondition (TODO data): a paid order that is still cancellable. The "Free Cancellation!" banner (48-hour window) is visible in the design.
appId: com.im24x7.fms.customer.staging   # TODO confirm app
env:
